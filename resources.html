<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Art Resources Catalogue</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="icon" type="image/x-icon" href="images/pallette.svg"/>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

      crossorigin="anonymous"
    />
    <link href="/css/custom-styles.css" rel="stylesheet"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="module" src="/javascript/resources-script.js"></script>
  </head>
  <body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark border border-light border-3">
        <div class="container-fluid">
            <a class="navbar-brand me-auto m-3 fw-bold mx-lg-5 fs-5" href="index.html">Art Resources Catalogue</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button> 
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto fw-bold mx-5 gap-2 gap-lg-5 fs-6">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="resources.html">Resources</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="flex-container sticky-top" id="resource-filter">
        <div class="bg-secondary text-light d-grid gap-2">
            <button id="filter-toggle" type="button" class="btn btn-secondary py-3">
                Click to show/hide filter options
            </button>
            <div id="filters">
            
                    <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-2 m-3">
                        <p>
                            Tags to include:
                        </p>
                        <div id="tags" class="d-flex flex-wrap gap-2">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tag1" value="tag1">
                                <label class="form-check-label" for="tag1">tag1</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tag2" value="tag2">
                                <label class="form-check-label" for="tag2">tag2</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tag3" value="tag3">
                                <label class="form-check-label" for="tag3">tag3</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tag4" value="tag4">
                                <label class="form-check-label" for="tag4">tag4</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tag5" value="tag5">
                                <label class="form-check-label" for="tag5">tag5</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="tag6" value="tag6">
                                <label class="form-check-label" for="tag6">tag6</label>
                            </div>
                        </div>
                        <div>
                            <button id="filter-button" type="button" class="btn btn-light py-2">
                                Filter By Tags
                            </button>
                        </div>
                    </div>

            </div>
        </div>
    </div>

    <main class="container mt-5 text-light flex-grow-1">

        <div id="card-container"></div>
        
    </main>

    <footer class="container-fluid mt-auto bg-dark p-3 text-light text-center border-top border-light border-3">
        <div>
            <p>Other links: 
                <a href="https://github.com/Katie-Eastman" target="_blank" class="pink clickable-pink text-decoration-none">My GitHub</a> |
                <a href="https://katie-eastman.github.io/Portfolio/" target="_blank" class="pink clickable-pink text-decoration-none">My Portfolio</a>
            </p>
        </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
